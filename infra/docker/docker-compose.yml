name: flows-helpdesk

services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB 8.0 (Single-Node Replica Set rs0)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: flows-hd-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-flows_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-flows_secret_change_me}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-flows_helpdesk}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh "$$@"
      - --
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-flows_admin}", "-p", "${MONGO_ROOT_PASSWORD:-flows_secret_change_me}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flows-net

  mongo-init:
    image: mongo:8.0
    container_name: flows-hd-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-flows_admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-flows_secret_change_me}
    volumes:
      - ./mongo/init-replica.sh:/scripts/init-replica.sh:ro
    entrypoint: ["bash", "/scripts/init-replica.sh"]
    networks:
      - flows-net

  # ---------------------------------------------------------------------------
  # 2. Redis 8.0
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.0-alpine
    container_name: flows-hd-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-flows_redis_change_me}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-flows_redis_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flows-net

  # ---------------------------------------------------------------------------
  # 3. RabbitMQ 4.4
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    container_name: flows-hd-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-flows_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-flows_mq_change_me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/flows-helpdesk}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flows-net

  # ---------------------------------------------------------------------------
  # 4. RustFS S3-Compatible Object Storage (No minio-init container needed)
  # ---------------------------------------------------------------------------
  minio:
    image: rustfs/rustfs:latest
    container_name: flows-hd-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-flows_minio_admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-flows_minio_secret_change_me}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - flows-net

  # ---------------------------------------------------------------------------
  # 5. Express REST API + Socket.IO Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
    container_name: flows-hd-api
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ../../apps/api/src:/workspace/apps/api/src
      - ../../packages/shared/src:/workspace/packages/shared/src
    command: ["pnpm", "--filter", "@flows-helpdesk/api", "dev"]
    networks:
      - flows-net

  # ---------------------------------------------------------------------------
  # 6. Background Workers
  # ---------------------------------------------------------------------------
  workers:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
    container_name: flows-hd-workers
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../../apps/workers/src:/workspace/apps/workers/src
      - ../../packages/shared/src:/workspace/packages/shared/src
    command: ["pnpm", "--filter", "@flows-helpdesk/workers", "dev"]
    networks:
      - flows-net

  # ---------------------------------------------------------------------------
  # 7. React 19 + Vite Frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
    container_name: flows-hd-web
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/web/src:/workspace/apps/web/src
      - ../../apps/web/index.html:/workspace/apps/web/index.html
      - ../../packages/shared/src:/workspace/packages/shared/src
    command: ["pnpm", "--filter", "@flows-helpdesk/web", "dev", "--host", "0.0.0.0"]
    networks:
      - flows-net

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  flows-net:
    driver: bridge